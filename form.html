<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><form></title>
</head>
<body>
    <fieldset>
        <legend>Biodata<l/legend>
    
            <form action="#" name="" target="" method="post">
                <label for="name">Name:</label>
                <input type="text" name="name" placeholder="Enter your name">
                <br></br>
                <label for="password">Password:</label>
                <input type="password" name="password" placeholder="Enter your password">
                <br><br>
                <label for="tel">Telephone:</label>
                <input type="tel" name="tel" id="tel">
                <br><br>
                <label for="email">Email:</label>
                <input type="email" name="email" placeholder="Enter your email">
                <br></br>
                <label for="DOB">Date of Birth:</label>
                <input type="date" name="dob" id="dob">
                <br></br>
                <label for="add">Address</label>
                <textarea name="add" id="add"></textarea>
                <br></br>
                <label for="gender">Gender:</label>
                <input type="radio" name="gender" id="gender"><label for="gender">Male</label>
                <input type="radio" name="gender" id="gender"><label for="gender">Female</label>
                <br></br>
                <label for="hobby">Hobby</label>
                <input type="checkbox" name="hobby1" id="hobby1"><label for="hobby1">Cricket</label>
                <input type="checkbox" name="hobby2" id="hobby2"><label for="hobby2">Football</label>
                <br></br>
                <label for="lang">Select any one programming language:</label>
                <select name="lang" id="lang">
                    <option value="select">Select</option>
                    <option value="c">C</option>
                    <option value="cpp">C++</option>
                    <option value="java">Java</option>
                    <option value="python">Python</option>
            </form>
    </fieldset>
    
</body>
</html>
