
<!DOCTYPE html>
<html>
<head>
    <title>Multimedia Web Page</title>
</head>
<body>

    <h1>Multimedia Web Page</h1>
    <hr>

    <h2>BMW Car Image</h2>

    <img src="web page image.jpeg"
         alt="BMW Car"
         width="400">

    <hr>

    <h2>Audio</h2>

    <audio controls>
        <source src="web page audio.mp3" type="audio/mpeg">
        Your browser does not support audio.
    </audio>

    <hr>

    <h2>Video</h2>

    <video width="400" controls>
        <source src="web page video.mp4" type="video/mp4">
        Your browser does not support video.
    </video>

    <hr>

    <p>&copy; 2026 Multimedia Web Page</p>

</body>
</html>
